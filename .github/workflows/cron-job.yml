name: Refresh JOIN companies

on:
  schedule:
    - cron: "17 20 * * *"
  workflow_dispatch:
    inputs:
      crawl_count:
        description: "Recent Common Crawl collections to union"
        required: true
        default: "4"

permissions:
  contents: write

concurrency:
  group: join-company-refresh
  cancel-in-progress: false

jobs:
  refresh-companies:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate installation
        run: python -m pip check

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Discover JOIN companies
        env:
          API_KEYS: ${{ secrets.API_KEYS }}
          CSE_CONFIG: ${{ secrets.CSE_CONFIG }}
          CC_CRAWL_COUNT: ${{ github.event.inputs.crawl_count || '4' }}
          DISCOVERY_TIMEOUT_SECONDS: "180"
          MIN_COMPANY_COUNT: "6000"
          MAX_COMPANY_COUNT: "50000"
        run: python script.py

      - name: Validate generated catalog
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          records = json.loads(Path("websites.json").read_text(encoding="utf-8"))
          slugs = [record["company_name"] for record in records]
          if len(records) < 6000:
              raise SystemExit(f"Catalog is unexpectedly small: {len(records)}")
          if len(records) != len(set(slugs)):
              raise SystemExit("Catalog contains duplicate company slugs")
          if slugs != sorted(slugs):
              raise SystemExit("Catalog is not sorted")
          print(f"Validated {len(records)} unique JOIN companies")
          PY

      - name: Commit catalog changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add websites.json
          if git diff --cached --quiet; then
            echo "No company catalog changes"
            exit 0
          fi
          git commit -m "Refresh JOIN company catalog"
          git pull --rebase origin main
          git push origin "HEAD:${GITHUB_REF_NAME}"
